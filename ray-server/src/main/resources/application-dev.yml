spring:
  config:
    activate:
      on-profile: dev
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:schema-init.sql
      data-locations: classpath:seed-dev.sql
logging:
  level:
    com.ray: DEBUG

ray:
  qr:
    hmac-secret: ${RAY_QR_HMAC_SECRET:dev-only-qr-secret-change-in-production}
  payment:
    mode: MOCK
  auth:
    sms:
      mode: MOCK
      mock-code: ${SMS_MOCK_CODE:123456}
