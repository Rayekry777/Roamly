server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roamly
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: com.ray.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ray: INFO
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level --- [%thread] %logger{36} : %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

knife4j:
  enable: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 2592000
  active-timeout: 604800
  auto-renew: true
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  logout-range: TOKEN
  is-print: false

ray:
  upload:
    image-dir: ${IMAGE_UPLOAD_DIR:./uploads}
    temporary-retention-hours: ${MEDIA_TEMPORARY_RETENTION_HOURS:24}
    cleanup-initial-delay-ms: ${MEDIA_CLEANUP_INITIAL_DELAY_MS:60000}
    cleanup-interval-ms: ${MEDIA_CLEANUP_INTERVAL_MS:3600000}
