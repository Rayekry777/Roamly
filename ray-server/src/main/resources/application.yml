server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roamly
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:1}
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  type-aliases-package: com.ray.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ray: INFO
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level --- [%thread] %logger{36} : %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

knife4j:
  enable: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  token-style: uuid
  timeout: 2592000
  active-timeout: 604800
  auto-renew: true
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  logout-range: TOKEN
  is-print: false

ray:
  merchant-invitation:
    hmac-secret: ${RAY_MERCHANT_INVITATION_HMAC_SECRET:dev-only-merchant-invitation-secret-change-in-production}
  payment:
    mode: ${RAY_PAYMENT_MODE:MOCK}
  cache:
    shop-ttl: 30m
    dictionary-ttl: 6h
    null-ttl: 2m
  order:
    coordination:
      lock-wait: 1s
  upload:
    # 统一本地文件根目录；消费者与商户分别使用 user/merchant 子目录。
    image-dir: ${MEDIA_STORAGE_ROOT:./uploads}
    temporary-retention-hours: ${MEDIA_TEMPORARY_RETENTION_HOURS:24}
    cleanup-initial-delay-ms: ${MEDIA_CLEANUP_INITIAL_DELAY_MS:60000}
    cleanup-interval-ms: ${MEDIA_CLEANUP_INTERVAL_MS:3600000}
  storage:
    mode: ${OBJECT_STORAGE_MODE:LOCAL}
    temporary-retention-hours: ${BUSINESS_MEDIA_TEMPORARY_RETENTION_HOURS:24}
    cleanup-initial-delay-ms: ${BUSINESS_MEDIA_CLEANUP_INITIAL_DELAY_MS:90000}
    cleanup-interval-ms: ${BUSINESS_MEDIA_CLEANUP_INTERVAL_MS:3600000}
    local:
      root: ${MEDIA_STORAGE_ROOT:./uploads}/merchant
      bucket: ${OBJECT_STORAGE_LOCAL_BUCKET:roamly-business-local}
    s3:
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
