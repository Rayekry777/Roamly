spring:
  config:
    activate:
      on-profile: test
  sql:
    init:
      mode: never
  data:
    redis:
      database: ${TEST_REDIS_DATABASE:15}

logging:
  level:
    com.ray: INFO

ray:
  auth:
    sms:
      mode: MOCK
      mock-code: ${SMS_MOCK_CODE:123456}
  storage:
    mode: LOCAL
    local:
      root: ${TEST_OBJECT_STORAGE_ROOT:./target/test-business-objects}
      bucket: roamly-business-test
